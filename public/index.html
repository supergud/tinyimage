<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TinyImage — 圖片壓縮工具</title>
    <link rel="stylesheet" href="style.css">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3790828781240420"
        crossorigin="anonymous"></script>
</head>

<body>

    <!-- ── Header ── -->
    <header class="header">
        <div class="header-inner">
            <div class="logo">
                <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
                    <rect width="36" height="36" rx="10" fill="white" fill-opacity="0.2" />
                    <rect x="6" y="6" width="10" height="10" rx="2" fill="white" />
                    <rect x="20" y="6" width="10" height="10" rx="2" fill="white" fill-opacity="0.7" />
                    <rect x="6" y="20" width="10" height="10" rx="2" fill="white" fill-opacity="0.7" />
                    <rect x="20" y="20" width="10" height="10" rx="2" fill="white" />
                    <path d="M16 11 L20 11 M11 16 L11 20 M25 16 L25 20 M16 25 L20 25" stroke="white" stroke-width="1.5"
                        stroke-linecap="round" />
                </svg>
                <h1>TinyImage</h1>
            </div>
            <p class="tagline">智慧圖片壓縮與裁切工具</p>
        </div>
    </header>

    <!-- ── Main ── -->
    <main class="main">
        <div class="container">

            <!-- Mode Tabs -->
            <div class="tabs" role="tablist">
                <button class="tab-btn active" data-mode="compress" role="tab" aria-selected="true">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="4 14 10 14 10 20" />
                        <polyline points="20 10 14 10 14 4" />
                        <line x1="14" y1="10" x2="21" y2="3" />
                        <line x1="3" y1="21" x2="10" y2="14" />
                    </svg>
                    壓縮 / 縮小
                </button>
                <button class="tab-btn" data-mode="crop" role="tab" aria-selected="false">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 2 6 6 2 6" />
                        <polyline points="18 22 18 18 22 18" />
                        <path d="M6 18H16a2 2 0 0 0 2-2V6" />
                        <path d="M6 6H4" />
                        <path d="M18 18h2" />
                    </svg>
                    裁切並壓縮
                </button>
            </div>

            <!-- Settings Card -->
            <div class="card settings-card">

                <!-- 壓縮設定 -->
                <div class="settings-panel" id="compress-settings">
                    <div class="settings-row">
                        <div class="setting-group">
                            <label for="compress-width">
                                縮小寬度
                                <span class="badge-optional">選填</span>
                            </label>
                            <div class="input-unit">
                                <input type="number" id="compress-width" min="1" max="10000" placeholder="不限">
                                <span>px</span>
                            </div>
                        </div>
                        <div class="setting-group">
                            <label for="compress-height">
                                縮小高度
                                <span class="badge-optional">選填</span>
                            </label>
                            <div class="input-unit">
                                <input type="number" id="compress-height" min="1" max="10000" placeholder="不限">
                                <span>px</span>
                            </div>
                        </div>
                    </div>
                    <p class="hint">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10" />
                            <line x1="12" y1="8" x2="12" y2="12" />
                            <line x1="12" y1="16" x2="12.01" y2="16" />
                        </svg>
                        留空則維持原始比例，僅做高效壓縮；填寫後等比縮小至指定邊長內
                    </p>
                </div>

                <!-- 裁切設定 -->
                <div class="settings-panel hidden" id="crop-settings">
                    <div class="settings-row">
                        <div class="setting-group">
                            <label for="crop-width">
                                裁切寬度
                                <span class="badge-required">必填</span>
                            </label>
                            <div class="input-unit">
                                <input type="number" id="crop-width" min="1" max="10000" placeholder="如 800">
                                <span>px</span>
                            </div>
                        </div>
                        <div class="setting-group">
                            <label for="crop-height">
                                裁切高度
                                <span class="badge-required">必填</span>
                            </label>
                            <div class="input-unit">
                                <input type="number" id="crop-height" min="1" max="10000" placeholder="如 600">
                                <span>px</span>
                            </div>
                        </div>
                        <div class="setting-group">
                            <label for="crop-position">裁切錨點</label>
                            <select id="crop-position">
                                <option value="centre">⊙ 置中</option>
                                <option value="north">↑ 上方</option>
                                <option value="south">↓ 下方</option>
                                <option value="east">→ 右側</option>
                                <option value="west">← 左側</option>
                                <option value="northwest">↖ 左上</option>
                                <option value="northeast">↗ 右上</option>
                                <option value="southwest">↙ 左下</option>
                                <option value="southeast">↘ 右下</option>
                                <option value="attention">🔍 智慧辨識</option>
                            </select>
                        </div>
                    </div>
                    <p class="hint">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10" />
                            <line x1="12" y1="8" x2="12" y2="12" />
                            <line x1="12" y1="16" x2="12.01" y2="16" />
                        </svg>
                        圖片將裁切為精確的指定尺寸，超出部分依錨點方向裁去
                    </p>
                </div>
            </div>

            <!-- Upload Card -->
            <div class="card upload-card" id="upload-card">
                <div class="drop-zone" id="drop-zone" tabindex="0" role="button" aria-label="上傳圖片">
                    <svg class="drop-icon" width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
                        <circle cx="8.5" cy="8.5" r="1.5" />
                        <polyline points="21 15 16 10 5 21" />
                    </svg>
                    <p class="drop-title">拖曳圖片到此處</p>
                    <p class="drop-or">— 或 —</p>
                    <label class="btn-upload" for="file-input">選擇圖片</label>
                    <input type="file" id="file-input" accept="image/jpeg,image/png,image/webp,image/gif,image/avif"
                        multiple hidden>
                    <p class="drop-hint">支援 JPG · PNG · WebP &nbsp;·&nbsp; 單檔最大 50 MB</p>
                </div>
            </div>

            <!-- File List Section -->
            <section class="file-list-section" id="file-list-section" hidden>
                <div class="file-list-header">
                    <h2>處理清單（<span id="file-count">0</span> 個檔案）</h2>
                    <div class="header-actions">
                        <button class="btn-ghost" id="clear-all">清除全部</button>
                        <button class="btn-primary" id="process-all">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                                <polygon points="5 3 19 12 5 21 5 3" />
                            </svg>
                            開始處理
                        </button>
                    </div>
                </div>

                <div class="file-list" id="file-list"></div>

                <div class="download-all-bar" id="download-all-bar" hidden>
                    <button class="btn-download-all" id="download-all">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                            <polyline points="7 10 12 15 17 10" />
                            <line x1="12" y1="15" x2="12" y2="3" />
                        </svg>
                        全部下載（ZIP）
                    </button>
                </div>
            </section>

        </div>
    </main>

    <footer class="footer">
        <p>TinyImage — 本地圖片壓縮，檔案不會上傳至任何伺服器</p>
    </footer>

    <!-- JSZip for batch download -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"
        integrity="sha512-XMVd28F1oH/O71fzwBnV7HucLxVwtxf26XV8P4wPk26EDxuGZ91N8bsOttmnomcCD3CS5ZMRL50H0GgOHvegtg=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="script.js"></script>
</body>

</html>
